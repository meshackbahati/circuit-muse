name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-linux-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-linux-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libudev-dev \
            xdg-utils

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download arduino-cli
        run: |
          mkdir -p src-tauri/binaries
          curl -sL "https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz" | tar xz -C src-tauri/binaries/
          mv src-tauri/binaries/arduino-cli src-tauri/binaries/arduino-cli-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/arduino-cli-x86_64-unknown-linux-gnu

      - name: Build engine with PyInstaller
        run: |
          cd engine
          python -m venv venv-build
          source venv-build/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --clean --noconfirm circuit-muse-engine.spec
          cp dist/circuit-muse-engine ../src-tauri/binaries/circuit-muse-engine-x86_64-unknown-linux-gnu
          chmod +x ../src-tauri/binaries/circuit-muse-engine-x86_64-unknown-linux-gnu

      - name: Verify sidecars are populated
        shell: bash
        run: |
          test -s src-tauri/binaries/circuit-muse-engine-* || { echo "engine sidecar is empty"; exit 1; }
          test -s src-tauri/binaries/arduino-cli-* || { echo "arduino-cli sidecar is empty"; exit 1; }

      - name: Install app dependencies and build
        working-directory: app
        run: |
          npm install
          npm run build -- --mode desktop

      - name: Build Tauri
        working-directory: src-tauri
        env:
          # linuxdeploy and appimagetool are AppImages themselves. Extract and
          # run avoids a hard dependency on FUSE in CI containers.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz

  build-fedora:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y gcc nodejs npm python3 python3-pip webkit2gtk4.1-devel gtk3-devel libsoup3-devel patchelf openssl-devel xdg-utils

      - name: Update npm for Fedora container
        run: npm install --global npm@11

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download arduino-cli
        run: |
          mkdir -p src-tauri/binaries
          curl -sL "https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz" | tar xz -C src-tauri/binaries/
          mv src-tauri/binaries/arduino-cli src-tauri/binaries/arduino-cli-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/arduino-cli-x86_64-unknown-linux-gnu

      - name: Build engine with PyInstaller
        run: |
          cd engine
          python -m venv venv-build
          source venv-build/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --clean --noconfirm circuit-muse-engine.spec
          cp dist/circuit-muse-engine ../src-tauri/binaries/circuit-muse-engine-x86_64-unknown-linux-gnu
          chmod +x ../src-tauri/binaries/circuit-muse-engine-x86_64-unknown-linux-gnu

      - name: Verify sidecars are populated
        shell: bash
        run: |
          test -s src-tauri/binaries/circuit-muse-engine-* || { echo "engine sidecar is empty"; exit 1; }
          test -s src-tauri/binaries/arduino-cli-* || { echo "arduino-cli sidecar is empty"; exit 1; }

      - name: Install app dependencies and build
        working-directory: app
        run: |
          npm install
          npm run build -- --mode desktop

      - name: Build Tauri (RPM only)
        working-directory: src-tauri
        run: cargo tauri build --bundles rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-build
          path: src-tauri/target/release/bundle/rpm/*.rpm

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-windows-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download arduino-cli
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries
          Invoke-WebRequest -Uri "https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Windows_64bit.zip" -OutFile arduino-cli.zip
          Expand-Archive -Path arduino-cli.zip -DestinationPath src-tauri/binaries -Force
          Move-Item src-tauri\binaries\arduino-cli.exe src-tauri\binaries\arduino-cli-x86_64-pc-windows-msvc.exe -Force

      - name: Build engine with PyInstaller
        run: |
          cd engine
          python -m venv venv-build
          .\venv-build\Scripts\python.exe -m pip install -r requirements.txt pyinstaller
          .\venv-build\Scripts\python.exe -m PyInstaller --clean --noconfirm circuit-muse-engine.spec
          copy dist\circuit-muse-engine.exe ..\src-tauri\binaries\circuit-muse-engine-x86_64-pc-windows-msvc.exe

      - name: Verify sidecars are populated
        shell: bash
        run: |
          test -s src-tauri/binaries/circuit-muse-engine-* || { echo "engine sidecar is empty"; exit 1; }
          test -s src-tauri/binaries/arduino-cli-* || { echo "arduino-cli sidecar is empty"; exit 1; }

      - name: Install app dependencies and build
        working-directory: app
        run: |
          npm install
          npm run build -- --mode desktop

      - name: Build Tauri
        working-directory: src-tauri
        run: cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-macos-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-macos-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download arduino-cli
        run: |
          mkdir -p src-tauri/binaries
          curl -sL "https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_macOS_ARM64.tar.gz" | tar xz -C src-tauri/binaries/
          mv src-tauri/binaries/arduino-cli src-tauri/binaries/arduino-cli-aarch64-apple-darwin
          chmod +x src-tauri/binaries/arduino-cli-aarch64-apple-darwin

      - name: Build engine with PyInstaller
        run: |
          cd engine
          python -m venv venv-build
          source venv-build/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --clean --noconfirm circuit-muse-engine.spec
          cp dist/circuit-muse-engine ../src-tauri/binaries/circuit-muse-engine-aarch64-apple-darwin
          chmod +x ../src-tauri/binaries/circuit-muse-engine-aarch64-apple-darwin

      - name: Verify sidecars are populated
        shell: bash
        run: |
          test -s src-tauri/binaries/circuit-muse-engine-* || { echo "engine sidecar is empty"; exit 1; }
          test -s src-tauri/binaries/arduino-cli-* || { echo "arduino-cli sidecar is empty"; exit 1; }

      - name: Install app dependencies and build
        working-directory: app
        run: |
          npm install
          npm run build -- --mode desktop

      - name: Build Tauri
        working-directory: src-tauri
        run: cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

  build-arch:
    name: Build Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel rust nodejs npm python python-pip webkit2gtk-4.1 appmenu-gtk-module libappindicator-gtk3 librsvg patchelf xdg-utils openssl gtk3 libsoup3

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download arduino-cli
        run: |
          mkdir -p src-tauri/binaries
          curl -sL "https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz" | tar xz -C src-tauri/binaries/
          mv src-tauri/binaries/arduino-cli src-tauri/binaries/arduino-cli-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/arduino-cli-x86_64-unknown-linux-gnu

      - name: Build engine with PyInstaller
        run: |
          cd engine
          python -m venv venv-build
          source venv-build/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --clean --noconfirm circuit-muse-engine.spec
          cp dist/circuit-muse-engine ../src-tauri/binaries/circuit-muse-engine-x86_64-unknown-linux-gnu
          chmod +x ../src-tauri/binaries/circuit-muse-engine-x86_64-unknown-linux-gnu

      - name: Verify sidecars are populated
        shell: bash
        run: |
          test -s src-tauri/binaries/circuit-muse-engine-* || { echo "engine sidecar is empty"; exit 1; }
          test -s src-tauri/binaries/arduino-cli-* || { echo "arduino-cli sidecar is empty"; exit 1; }

      - name: Install app dependencies and build
        working-directory: app
        run: |
          npm install
          npm run build -- --mode desktop

      - name: Build Tauri binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Build Arch package
        run: |
          mkdir -p arch-build
          cp src-tauri/target/release/circuit-muse arch-build/circuit-muse
          cp src-tauri/binaries/circuit-muse-engine-x86_64-unknown-linux-gnu arch-build/circuit-muse-engine-x86_64-unknown-linux-gnu
          cp src-tauri/binaries/arduino-cli-x86_64-unknown-linux-gnu arch-build/arduino-cli-x86_64-unknown-linux-gnu
          chmod +x arch-build/*
          cat > arch-build/PKGBUILD << 'PKGEOF'
          # Maintainer: Meshack Bahati Ouma <meshackbahati@users.noreply.github.com>
          pkgname=circuit-muse
          pkgver=1.0.6
          pkgrel=1
          pkgdesc="AI-powered circuit simulator and embedded board emulator"
          arch=('x86_64')
          url="https://github.com/meshackbahati/circuit-muse"
          license=('MIT')
          depends=('webkit2gtk-4.1' 'gtk3' 'libsoup3' 'libappindicator-gtk3')
          source=("circuit-muse" "circuit-muse-engine-x86_64-unknown-linux-gnu" "arduino-cli-x86_64-unknown-linux-gnu")
          sha256sums=('SKIP' 'SKIP' 'SKIP')
          package() {
            install -Dm755 "$srcdir/circuit-muse" "$pkgdir/usr/bin/circuit-muse"
            install -Dm755 "$srcdir/circuit-muse-engine-x86_64-unknown-linux-gnu" "$pkgdir/usr/bin/circuit-muse-engine-x86_64-unknown-linux-gnu"
            install -Dm755 "$srcdir/arduino-cli-x86_64-unknown-linux-gnu" "$pkgdir/usr/bin/arduino-cli-x86_64-unknown-linux-gnu"
          }
          PKGEOF
          useradd -m builder
          cp -r arch-build /home/builder/arch-build
          chown -R builder:builder /home/builder/arch-build
          su - builder -c "cd /home/builder/arch-build && makepkg --noconfirm --noprogressbar --skippgpcheck"
          mkdir -p $GITHUB_WORKSPACE/arch-build
          cp /home/builder/arch-build/*.pkg.tar.zst $GITHUB_WORKSPACE/arch-build/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-build
          path: arch-build/*.pkg.tar.zst

  create-release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos, build-arch, build-fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CircuitMuse ${{ github.ref_name }}"
          overwrite_files: true
          body: |
            ## CircuitMuse ${{ github.ref_name }}: Reliability, Performance and Desktop UI Update

            AI-powered circuit simulator and embedded board emulator for desktop. Design circuits, write Arduino code, and run real emulations in one app.

            ### Changes in this release

            - NVIDIA NIM now works in the desktop app. Model discovery and chat requests are relayed through the bundled local engine because the NVIDIA API sends no CORS headers to the desktop WebView. The live API returned its current catalogue and accepted streaming tool calls.
            - Model lists are discovered from each provider API at runtime. No model names are bundled.
            - Anthropic requests now send the browser access header that Anthropic requires, so direct calls succeed from the desktop shell.
            - Authentication, rate limit, and network failures produce actionable messages instead of a bare `Load failed`.
            - The agent reads attached text files, images, PDFs, and DOCX documents. The Attach control appears in the chat header and the input row.
            - The agent continues after fragmentary model output, keeps tool results in history, and stops only on a final answer, a repeated call, or the iteration limit.
            - Multi-board circuits expose `compile_all_code`, which compiles each board once with its own file group.
            - `Ctrl+S` and `Ctrl+Shift+S` open a save dialog with a project name field. Chat history and attachments are restored with the project.
            - Interactive parts accept pointer input while a board runs, including pushbuttons, switches, potentiometers, keypads, and encoders.
            - The wire layer now sits below components, so cables no longer cover displays or block clicks.
            - The oscilloscope resizes with its panel and selects a wired pin by default.
            - Release jobs verify that the engine and Arduino CLI sidecars are populated before packaging.
            - The assistant is now a docked panel that pushes the workspace and can be resized, minimized, or closed. Conversation history is searchable, and pasted or dropped files appear as attachment previews.
            - The main Compile and Run buttons act on every board in a multi-board circuit, each with its own source files. A hardware flash button was added for compiled boards.
            - `check_wiring` reports unconnected components and orphan wires so the agent can finish wiring before it compiles.
            - The desktop window uses a lightweight custom title bar without native OS chrome, so the navigation bar no longer hides behind the desktop top bar.
            - Simulation frames are time-sliced to keep scrolling and clicking responsive on low-power laptops. Serial buffers, conversation transcripts and sample buffers are bounded.
            - The oscilloscope has quick channel setup, per-channel frequency and duty readouts, an expandable display, and a lower redraw rate.
            - Digital inputs now follow SPICE-solved net voltages, so buttons, direct 5 V wires and dividers reach `digitalRead()`. Parts wired to a non-active board now drive that board's pin registers instead of the active board's.

            ### What's Inside

            - **Premium Features are now Open-Source & Free**:
              - **microSD File Upload**: Write files directly to emulated microSD cards with a fully integrated FAT filesystem manager.
              - **STM32 and QEMU Raspberry Pi Emulation**: Support for STM32 Blue Pill/Nucleo, and Raspberry Pi 3B/4B/5 board families.
              - **Export Schematic Images & BOM**: Export clean, precise schematic layout PNGs and CSV Bill of Materials for your designs.

            - **Massive Performance & Speedups**:
              - **15x Faster Compilation**: Introduced persistent compilation caching for Arduino board targets, accelerating subsequent compilations.

            - **Desktop & Layout Improvements**:
              - Fixed window layouts, responsive side panel navigation, external link redirection, and localized translation sync.
              - Cleaned up verbose compiler logs and resolved simulation timeout locks.

            - **Core Simulation Stack**:
              - **31 emulated boards**: Arduino Uno/Mega/Nano, ESP32/ESP32-S2/ESP32-S3/ESP32-C3, RP2040/RP2350, STM32, ATtiny85, and more
              - **150+ components**: resistors, capacitors, LEDs, sensors, displays, motors, ICs, and wireless modules
              - **Real CPU emulation**: not a toy simulator; actual compiled Arduino firmware running on emulated hardware
              - **SPICE analog simulation**: accurate voltage/current analysis for analog circuits
              - **AI agent**: connect NVIDIA NIM, Ollama, OpenAI, Anthropic, Gemini, Moonshot, OpenRouter, or any OpenAI-compatible endpoint for AI-assisted design and debugging
              - **Serial monitor**: real-time serial output from emulated boards
              - **Multi-file sketches**: write Arduino code with multiple .ino and .h files
              - **Library manager**: search and install Arduino libraries directly from the app
              - **Project save/load**: save your circuits and code as shareable project files
              - **Export**: generate Arduino sketches from your circuit designs
              - **Setup wizard**: guided first-run experience with board and AI configuration

            ### Supported Platforms

            | Platform | Format | Notes |
            |----------|--------|-------|
            | **Linux (x86_64)** | AppImage | Universal, works on Ubuntu, Debian, Fedora, Arch, and derivatives |
            | **Linux (x86_64)** | .deb | Debian/Ubuntu/Mint |
            | **Linux (x86_64)** | .pkg.tar.zst | Arch Linux / Manjaro, install with `pacman -U circuit-muse-1.0.6-1-x86_64.pkg.tar.zst` |
            | **Windows (x86_64)** | .exe (NSIS) | Windows 10/11 installer |
            | **Windows (x86_64)** | .msi | Windows MSI installer |
            | **macOS (ARM64)** | .dmg | Apple Silicon (M1/M2/M3/M4) |

            ### System Requirements

            - **RAM**: 4 GB minimum, 8 GB recommended
            - **Disk**: 500 MB free space (includes bundled arduino-cli and board cores)
            - **OS**: Linux (kernel 5.4+), Windows 10+, macOS 12+

            ### First Launch

            1. Open the app. The setup wizard will guide you through board and AI configuration
            2. Pick an emulated board from the canvas
            3. Place components and wire them up
            4. Write Arduino code in the editor
            5. Hit Compile & Run to see your circuit come alive

            ### Known Limitations

            - macOS build is ARM64 only (Apple Silicon). Intel Macs not yet supported.
            - WiFi/Bluetooth emulation is limited to basic packet loops
            - Some advanced ESP32 peripherals (USB-OTG, camera) are not emulated
            - Arduino-cli is bundled but core downloads require internet on first use

            ### Credits

            Built with [Tauri](https://tauri.app/), [React](https://react.dev/), [Pyodide](https://pyodide.org/), and [Arduino CLI](https://arduino.github.io/arduino-cli/).

            Report issues: https://github.com/meshackbahati/circuit-muse/issues
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.tar.gz
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.rpm
            artifacts/**/*.pkg.tar.zst
