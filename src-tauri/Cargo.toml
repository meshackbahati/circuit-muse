[package]
name = "circuit-muse"
version = "1.2.1"
edition = "2021"
authors = ["Meshack Bahati Ouma"]

[lib]
name = "circuit_muse_lib"
# Desktop builds use the library through Rust's normal rlib interface. Mobile
# shared/static outputs are not consumed by this desktop-only application and
# add large, unnecessary linker artifacts on low-disk developer machines.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
# rustls instead of the system OpenSSL: the binary then runs on any distro
# regardless of its OpenSSL version (the Arch package built against OpenSSL 4
# did not start on systems with OpenSSL 3).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
# Keep local Tauri builds practical on machines with limited disk space. The
# release profile remains optimized and unchanged.
debug = 0
